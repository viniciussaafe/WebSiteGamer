<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C&L.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Login com Supabase</title>
</head>

<body>
    <img src="/img/gallery-5.webp" alt="fundo">
    <div id="div_formulario">
        <h2>Login</h2>

        <form onsubmit="return false;">
            <input type="email" id="email" placeholder="Digite seu email" required>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
            <p id="mensagem"></p>
            <div class="botoes">
                <button type="button" onclick="login()">Entrar</button>
                <button type="button" onclick="cadastrar()">Cadastrar</button>
            </div>
        </form>
    </div>
    <p id="mensagem"></p>

    <script>
        const supabase = window.supabase.createClient(
            "https://lcdiltuwzlijmlvxeyjh.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZGlsdHV3emxpam1sdnhleWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwMDI1NTEsImV4cCI6MjA3NzU3ODU1MX0.ck39kNprNgKmC9BbxDW_kARvy7h6_YMluVzV-wW7cZY"
        );
        async function login() {
            console.log("Tentando fazer login...");
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();

            if (!email || !senha) {
                document.getElementById("mensagem").innerText = "Preencha todos os campos!";
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

            if (error) {
                document.getElementById("mensagem").innerText = "Erro: " + error.message;
            } else {
                document.getElementById("mensagem").innerText = "Login realizado com sucesso!";
                localStorage.setItem("usuarioEmail", email);
                localStorage.setItem("usuarioLogado", "true");
                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 2000);
            }
        }

        async function cadastrar() {
            console.log("Tentando cadastrar...");
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();

            if (!email || !senha) {
                document.getElementById("mensagem").innerText = "Preencha todos os campos!";
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password: senha });

            if (error) {
                document.getElementById("mensagem").innerText = "Erro: " + error.message;
            } else {
                document.getElementById("mensagem").innerText = "Cadastro realizado com sucesso!";
            }
        }
    </script>

</body>

</html>
